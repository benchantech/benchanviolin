name: Temporary CEdev Fetch

on:
  push:
    branches: [temp-cedev-toolchain-fetch]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official CEdev v15 Linux toolchain
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            -o CEdev-Linux.tar.gz \
            https://github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz
          sha256sum CEdev-Linux.tar.gz
          test "$(sha256sum CEdev-Linux.tar.gz | awk '{print $1}')" = "85f4794a617b134249a9cba8a084414e86e16d2a68377b1d72ace30c636dbdf9"

      - name: Upload toolchain archive
        uses: actions/upload-artifact@v4
        with:
          name: CEdev-Linux-v15
          path: CEdev-Linux.tar.gz
          if-no-files-found: error
